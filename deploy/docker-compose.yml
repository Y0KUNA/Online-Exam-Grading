services:
  postgres-identity:
    image: postgres:17
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_db
      POSTGRES_PASSWORD: 12345678
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-submission:
    image: postgres:17
    environment:
      POSTGRES_DB: submission_db
      POSTGRES_USER: submission_db
      POSTGRES_PASSWORD: 12345678
    volumes: [submission-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-exam-grading:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: exam_grading_db
      POSTGRES_USER: exam_grading_db
      POSTGRES_PASSWORD: 12345678
    volumes: [exam-grading-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-result-review:
    image: postgres:17
    environment:
      POSTGRES_DB: result_review_db
      POSTGRES_USER: result_review_db
      POSTGRES_PASSWORD: 12345678
    volumes: [result-review-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing local/original; mc mb --ignore-existing local/anonymized;
      mc anonymous set none local/original; mc anonymous set none local/anonymized"
  api-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_UPSTREAM_HOST: minio:9000
      IDENTITY_URL: http://identity-service:8081
      SUBMISSION_URL: http://submission-service:8082
      EXAM_GRADING_URL: http://exam-grading-service:8083
      RESULT_REVIEW_URL: http://result-review-service:8084
      JWT_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      MAX_PDF_BYTES: ${MAX_PDF_BYTES}
      STORAGE_RATE_LIMIT_PER_MINUTE: ${STORAGE_RATE_LIMIT_PER_MINUTE}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  identity-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args: { SERVICE: identity-service }
    environment:
      DB_URL: jdbc:postgresql://postgres-identity:5432/identity_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres-identity: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  submission-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args: { SERVICE: submission-service }
    environment:
      DB_URL: jdbc:postgresql://postgres-submission:5432/submission_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    depends_on:
      postgres-submission: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  exam-grading-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args: { SERVICE: exam-grading-service }
    environment:
      DB_URL: jdbc:postgresql://postgres-exam-grading:5432/exam_grading_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-exam-grading: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  result-review-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args: { SERVICE: result-review-service }
    environment:
      DB_URL: jdbc:postgresql://postgres-result-review:5432/result_review_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-result-review: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  identity-data: {}
  submission-data: {}
  exam-grading-data: {}
  result-review-data: {}
  minio-data: {}
