services:
  postgres-identity:
    image: postgres:17
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-submission:
    image: postgres:17
    environment:
      POSTGRES_DB: submission_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes: [submission-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-exam-grading:
    image: postgres:17
    environment:
      POSTGRES_DB: exam_grading_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5434:5432"]
    volumes: [exam-grading-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-result-review:
    image: postgres:17
    environment:
      POSTGRES_DB: result_review_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5435:5432"]
    volumes: [result-review-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/minio@RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing local/original; mc mb --ignore-existing local/anonymized;
      mc anonymous set none local/original; mc anonymous set none local/anonymized"
  api-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      S3_INTERNAL_ENDPOINT: http://minio:9000
      IDENTITY_URL: http://identity-service:8081
      SUBMISSION_URL: http://submission-service:8082
      EXAM_GRADING_URL: http://exam-grading-service:8083
      RESULT_REVIEW_URL: http://result-review-service:8084
      JWT_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      MAX_PDF_BYTES: ${MAX_PDF_BYTES}
      STORAGE_RATE_LIMIT_PER_MINUTE: ${STORAGE_RATE_LIMIT_PER_MINUTE}
    ports: ["8080:8080"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  identity-data: {}
  submission-data: {}
  exam-grading-data: {}
  result-review-data: {}
  minio-data: {}
