server.port: ${SERVER_PORT:8082}
spring:
  application.name: submission-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/submission_db}
    username: ${DB_USER:exam_grading}
    password: ${DB_PASSWORD:change-me}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  rabbitmq.addresses: ${RABBITMQ_URL:amqp://localhost:5672}
  rabbitmq.publisher-confirm-type: correlated
  rabbitmq.publisher-returns: true
management.endpoints.web.exposure.include: health,info
logging.level.vn.edu.examgrading.submission: ${SUBMISSION_LOG_LEVEL:DEBUG}
result-review.base-url: ${RESULT_REVIEW_BASE_URL:http://localhost:8084}
app.internal.hmac-secret: ${IDENTITY_HMAC_SECRET:replace-with-a-32-byte-minimum-secret}
app:
  storage:
    mode: ${STORAGE_MODE:s3}
    endpoint: ${S3_INTERNAL_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:change-me}
    bucket: ${S3_BUCKET:original}
    anonymized-bucket: ${S3_ANONYMIZED_BUCKET:anonymized}
  upload:
    # Presigned POST urls are rewritten onto this public Gateway base (never expose the MinIO host).
    gateway-base: ${S3_PUBLIC_BASE:http://localhost:8080/storage}
    max-pdf-bytes: ${MAX_PDF_BYTES:52428800}
    ttl-minutes: ${UPLOAD_TTL_MINUTES:10}
    size-tolerance-bytes: ${UPLOAD_SIZE_TOLERANCE_BYTES:1024}
  pdf:
    # §7.5 untrusted-PDF resource limits (worker side, PageMasker/ValidationWorker).
    render-dpi: ${PDF_RENDER_DPI:200}
    min-render-dpi: ${PDF_MIN_RENDER_DPI:100}
    max-render-pixels: ${PDF_MAX_RENDER_PIXELS:40000000}
    max-page-points: ${PDF_MAX_PAGE_POINTS:14400}
    job-timeout-seconds: ${PDF_JOB_TIMEOUT_SECONDS:120}
  preview:
    # §4.5 anonymization-preview resource limits.
    max-concurrency: ${PREVIEW_MAX_CONCURRENCY:2}
    timeout-seconds: ${PREVIEW_TIMEOUT_SECONDS:15}
    rate-limit-per-minute: ${PREVIEW_RATE_LIMIT_PER_MINUTE:10}
    min-dpi: ${PREVIEW_MIN_DPI:50}
    max-dpi: ${PREVIEW_MAX_DPI:200}
  jobs:
    # Ops schedulers (Ticket 07). Cron exprs are Spring 6-field (sec min hour …).
    pool-size: ${JOBS_POOL_SIZE:4}
    # UPLOADING → FAILED/UPLOAD_ABANDONED sweep (spec §10: ABANDONED_SCAN_CRON).
    upload-cleanup-cron: ${ABANDONED_SCAN_CRON:0 */5 * * * *}
    # Orphan object scan in the original bucket (spec §10: ORPHAN_SCAN_CRON).
    orphan-cleanup-cron: ${ORPHAN_SCAN_CRON:0 0 * * * *}
    orphan-grace-minutes: ${ORPHAN_GRACE_MINUTES:60}
    # QUEUED ProcessingJob reconciler — republish lost messages (§8).
    reconcile-cron: ${RECONCILE_CRON:0 */5 * * * *}
    reconcile-stale-minutes: ${RECONCILE_STALE_MINUTES:10}
