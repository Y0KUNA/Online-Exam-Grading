server.port: ${SERVER_PORT:8081}
spring:
  application.name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:exam_grading}
    password: ${DB_PASSWORD:change-me}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info
app.auth:
  issuer: ${JWT_ISSUER:https://identity.local}
  ttl-minutes: ${JWT_TTL_MINUTES:15}
  local-enabled: ${AUTH_LOCAL_ENABLED:true}
  login-max-failures: ${LOGIN_MAX_FAILURES:5}
  login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-office-name: ${BOOTSTRAP_OFFICE_NAME:Phòng khảo thí}
  bootstrap-council-username: ${BOOTSTRAP_COUNCIL_USERNAME:}
  bootstrap-council-password: ${BOOTSTRAP_COUNCIL_PASSWORD:}
  bootstrap-council-name: ${BOOTSTRAP_COUNCIL_NAME:Hội đồng chấm thi}
