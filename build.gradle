plugins {
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'vn.edu.examgrading'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencyLocking { lockAllConfigurations() }

    tasks.register('verifySourceHygiene') {
        group = 'verification'
        description = 'Fails when Java/YAML sources contain trailing whitespace.'
        doLast {
            fileTree(projectDir) { include 'src/**/*.java', 'src/**/*.yml', 'src/**/*.yaml' }.each { file ->
                file.readLines('UTF-8').eachWithIndex { line, index ->
                    if (line ==~ /.*[ \\t]+$/) throw new GradleException("Trailing whitespace: ${file}:${index + 1}")
                }
            }
        }
    }
    tasks.named('check') { dependsOn tasks.named('verifySourceHygiene') }
}
