openapi: 3.0.3
info:
  title: Online Exam Grading Gateway
  version: 0.1.0
paths:
  /api/v1/exams:
    get:
      summary: List exams visible to the authenticated workspace role
      responses:
        '200': { description: Exam projection list }
    post:
      summary: Create an exam draft (EXAM_OFFICE)
      responses:
        '201': { description: Exam draft created }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Role is not EXAM_OFFICE }
  /api/v1/exams/{examId}/submissions:
    parameters: [{ name: examId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Office submission status projection for an exam (EXAM_OFFICE only)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: '{items:[{submissionId,examId,status,pageCount?,progress,error?,updatedAt}],nextCursor:string|null}'
        '400': { description: Invalid status, cursor, or limit }
        '403': { description: Role is not EXAM_OFFICE }
    post:
      summary: Initialize an ORIGINAL PDF upload (EXAM_OFFICE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId, templateId, fileName, fileSizeBytes, contentType]
      responses:
        '201': { description: Submission id and presigned POST form routed through Gateway }
        '422': { description: Invalid PDF metadata }
  /api/v1/submissions/{submissionId}:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Submission status projection (EXAM_OFFICE only, E-06)
      responses:
        '200':
          description: '{submissionId,examId,status,pageCount?,progress,error?:{code,message},updatedAt}'
        '403': { description: Role is not EXAM_OFFICE }
        '404': { description: Submission not found }
  /api/v1/submissions/{submissionId}/identity:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Candidate identity join for a submission (EXAM_OFFICE only, FR-019)
      description: Returns {candidateNumber,fullName,className,pseudonym}; audited on every call.
      responses:
        '200': { description: Identity projection without candidateId }
        '403': { description: Role is not EXAM_OFFICE }
        '404': { description: Submission or binding not found }
  /api/v1/exams/{examId}/submissions/events:
    parameters: [{ name: examId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: SSE stream of submission-status events for an exam (EXAM_OFFICE only)
      description: 'text/event-stream; event `submission-status` data {submissionId,status,progress,updatedAt}; id = event sequence; supports Last-Event-ID; heartbeat ~15s.'
      responses:
        '200': { description: SSE stream }
        '400': { description: Invalid Last-Event-ID }
        '403': { description: Role is not EXAM_OFFICE }
  /api/v1/submissions/{submissionId}/files:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: File version list (EXAM_OFFICE only, §4.4)
      description: 'Items {type,version,isCurrent,sizeBytes,sha256?,createdAt}; never returns object keys or URLs.'
      responses:
        '200': { description: '{items:[...]}' }
        '403': { description: Role is not EXAM_OFFICE }
        '404': { description: Submission not found }
  /api/v1/submissions/{submissionId}/pseudonym:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      summary: Manual phách edit (EXAM_OFFICE only, D-10)
      description: Body {pseudonym,reason}; reason mandatory. Rejected once FINALIZED; appends PseudonymHistory in Identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudonym, reason]
              properties:
                pseudonym: { type: string }
                reason: { type: string }
      responses:
        '200': { description: '{submissionId,pseudonym}' }
        '403': { description: Role is not EXAM_OFFICE }
        '404': { description: Submission not found }
        '409': { description: Already FINALIZED, no pseudonym yet, or value taken }
        '422': { description: Missing pseudonym or reason }
  /api/v1/submissions/{submissionId}/complete:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Confirm direct storage upload and queue validation (EXAM_OFFICE)
      responses:
        '200': { description: Submission is UPLOADED and validation is queued }
        '409': { description: Upload missing, expired, or no longer completable }
  /api/v1/submissions/{submissionId}/replace-file:
    parameters: [{ name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Request a scan replacement (EXAM_OFFICE, spec 10 §4.4 step 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, fileName, fileSizeBytes, contentType]
              properties:
                reason: { type: string }
                fileName: { type: string }
                fileSizeBytes: { type: integer, format: int64, maximum: 52428800 }
                contentType: { type: string, enum: [application/pdf] }
      responses:
        '201': { description: PENDING replacement created with presigned POST upload }
        '404': { description: Submission not found }
        '409': { description: 'REPLACE_NOT_ALLOWED, REVIEW_NOT_AUTHORIZED, ATTEMPTS_EXIST, or REPLACEMENT_IN_PROGRESS' }
        '422': { description: 'REASON_REQUIRED, UNSUPPORTED_CONTENT_TYPE, or INVALID_FILE_SIZE' }
  /api/v1/submissions/{submissionId}/files/{type}/access:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: type, in: path, required: true, schema: { type: string, enum: [ORIGINAL, ANONYMIZED] } }
      - { name: version, in: query, schema: { type: integer } }
    get:
      summary: Presigned GET for a file version (EXAM_OFFICE, spec 10 §4.4)
      description: ORIGINAL accepts ?version=n (default current; superseded scans viewable until retention). ANONYMIZED always serves the current version; 409 FILE_NOT_READY while reprocessing.
      responses:
        '200': { description: '{url, expiresAt, version}' }
        '403': { description: Role is not EXAM_OFFICE }
        '404': { description: Submission or file version not found }
        '409': { description: FILE_NOT_READY }
  /api/v1/submissions/{submissionId}/anonymization-preview:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Anonymization preview page 1 (EXAM_OFFICE, spec 10 §4.5)
      description: Renders page 1 as the grader would see it (MASKED) or with region outlines (OUTLINE). Body {version?, templateId?, mode?, dpi?, override?}. Returns image/png, Cache-Control no-store; nothing is persisted except an ANONYMIZATION_PREVIEWED audit row.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer }
                templateId: { type: string, format: uuid }
                mode: { type: string, enum: [MASKED, OUTLINE] }
                dpi: { description: '50-200 or "ANON_RENDER_DPI"' }
                override:
                  type: object
                  properties:
                    mask: { $ref: '#/components/schemas/Region' }
                    print: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: PNG image of page 1
          headers:
            X-Page-Width-Pt: { schema: { type: number } }
            X-Page-Height-Pt: { schema: { type: number } }
            X-Template-Deviation-Percent: { schema: { type: number } }
            X-Size-Check: { schema: { type: string, enum: [PASS, FAIL] } }
          content:
            image/png: {}
        '403': { description: Role is not EXAM_OFFICE }
        '409': { description: INVALID_STATE (UPLOADING / no ORIGINAL) }
        '422': { description: INVALID_REGION / INVALID_DPI / INVALID_MODE / PDF_CORRUPT / TEMPLATE_MASK_ERROR }
        '429': { description: PREVIEW_BUSY or RATE_LIMITED }
  /api/v1/reviews:
    get:
      summary: Review projection for EXAM_OFFICE or COUNCIL; excludes candidate identity
      parameters: [{ name: examId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Review list }
        '403': { description: Role is not permitted }
  /api/v1/exams/{examId}/results/export:
    parameters: [{ name: examId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Export finalized result core as CSV (EXAM_OFFICE only)
      responses:
        '200': { description: CSV download }
        '403': { description: Role is not EXAM_OFFICE }
  /api/v1/auth/login:
    post:
      summary: Public Identity login route
      responses:
        '200': { description: JWT issued by Identity service }
  /.well-known/jwks.json:
    get:
      summary: Public Identity JWKS route
      responses:
        '200': { description: JWKS }
  /storage/original:
    post:
      summary: Presigned multipart POST pass-through; authorization is enforced by MinIO policy.
      responses:
        '204': { description: Object uploaded }
        '403': { description: Invalid or expired storage signature }
  /storage/anonymized/{objectKey}:
    parameters: [{ name: objectKey, in: path, required: true, schema: { type: string } }]
    get:
      summary: Presigned GET pass-through; supports Range requests.
      responses:
        '200': { description: Object stream }
        '206': { description: Partial object stream }
        '403': { description: Invalid or expired storage signature }
