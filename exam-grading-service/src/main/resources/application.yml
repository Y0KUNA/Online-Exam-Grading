server.port: ${SERVER_PORT:8083}
spring:
  application.name: exam-grading-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/exam_grading_db}
    username: ${DB_USER:exam_grading}
    password: ${DB_PASSWORD:change-me}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info
app.internal.hmac-secret: ${IDENTITY_HMAC_SECRET:replace-with-a-32-byte-minimum-secret}
app:
  rubric-storage:
    endpoint: ${S3_INTERNAL_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:change-me}
    bucket: ${S3_RUBRIC_BUCKET:rubrics}
    gateway-base: ${S3_PUBLIC_BASE:http://localhost:8080/storage}
    max-pdf-bytes: ${MAX_RUBRIC_PDF_BYTES:52428800}
    upload-ttl-minutes: ${RUBRIC_UPLOAD_TTL_MINUTES:10}
